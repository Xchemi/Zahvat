name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: Portrait orientation
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Icons (optional)
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2a1766' --iconBackgroundColorDark '#2a1766'
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zahvat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
